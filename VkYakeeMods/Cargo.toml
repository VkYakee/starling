[package]
name = "vkyakee-mods"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors = ["VkYakee"]
description = "VkYakee Mod Framework and Hub for Starling Minecraft"

[features]
default = ["api", "vlakeematica_mod"]
api = []
vlakeematica_mod = ["dep:vlakeematica"]
vkmap = ["dep:vkmap"]
seedcracker = ["dep:seedcracker"]
vlakee_ui = ["dep:vlakee-ui"]

[dependencies]
seedcracker = { path = "seedcracker", optional = true }
vlakeematica = { path = "VlaKeeMatica", optional = true }
vlakee-ui = { path = "VlakeeUI", optional = true }
vkmap = { path = "VkMap", optional = true }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
