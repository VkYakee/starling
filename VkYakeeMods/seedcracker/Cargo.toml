[package]
name = "seedcracker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors = ["VkYakee", "SeedCracker Team"]
description = "High-performance Minecraft seed cracking engine for Starling"

[dependencies]
rayon = "1.10"
sha2 = "0.10.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
cc = "1.2"
