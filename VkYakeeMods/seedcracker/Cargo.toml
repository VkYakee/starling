[package]
name = "seedcracker"
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors = ["VkYakee"]
description = "High-performance Minecraft seed cracking engine for Starling/Horizon Rust - complete rewrite"

[dependencies]
rayon = "1.10"
sha2 = "0.10.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
parking_lot = "0.12"
crossbeam = "0.8"
horizon-core = { path = "../../crates/horizon-core" }
horizon-world = { path = "../../crates/horizon-world" }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"

[features]
default = ["std"]
std = []
