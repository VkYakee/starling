[package]
name = "seedcracker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "SeedCracker - High-performance Minecraft seed cracking engine for Horizon/Starling"

[lib]
crate-type = ["cdylib"]

[dependencies]
horizon-mod-sdk = { path = "../../crates/horizon-mod-sdk" }
horizon-core = { path = "../../crates/horizon-core" }
horizon-world = { path = "../../crates/horizon-world" }
sha2 = { version = "0.10", default-features = false, features = ["digest"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

[lints]
workspace = true
